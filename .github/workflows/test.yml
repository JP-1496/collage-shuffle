name: Collage multiplayer tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  multiplayer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check public/app.js
      - run: node --check server.js
      - run: npm test
